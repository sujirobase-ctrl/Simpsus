# Build and release BUIDL GUI + Android APK
name: Build and release BUIDL

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install Qt test libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run offline tests
        run: python -m pytest tests --ignore=tests/test_e2e.py --ignore=tests/test_mobile_bridge.py -q
      - name: Run Android Python bridge tests in isolation
        run: python -m pytest tests/test_mobile_bridge.py -q
      - name: Run local end-to-end tests
        run: python -m tests.test_e2e

  windows:
    name: Windows desktop GUI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt
      - name: Build desktop GUI
        run: pyinstaller --clean --noconfirm buidl-desktop.spec
      - name: Verify packaged GoFile runtime
        run: python tests/packaged_gofile_smoke.py dist/BUIDL-2.0.0.exe
      - name: Verify packaged TLS runtime
        run: python tests/packaged_https_smoke.py dist/BUIDL-2.0.0.exe
      - name: Collect GUI artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist/BUIDL-2.0.0.exe release/BUIDL-2.0.0.exe
      - uses: actions/upload-artifact@v4
        with:
          name: BUIDL-Windows-GUI
          path: release/BUIDL-2.0.0.exe
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build Android APK
        working-directory: android
        env:
          CHAQUOPY_PYTHON: ${{ env.pythonLocation }}/bin/python
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Collect APK artifact
        run: |
          mkdir release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/BUIDL-2.0.0-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BUIDL-Android-APK
          path: release/BUIDL-2.0.0-Android.apk
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tests, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches project version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "${GITHUB_REF_NAME}" = "v${version}"
      - uses: actions/download-artifact@v4
        with:
          pattern: BUIDL-*
          path: release-assets
          merge-multiple: true
      - name: Create release with only the GUI and APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/BUIDL-2.0.0.exe release-assets/BUIDL-2.0.0-Android.apk --verify-tag --generate-notes --title "BUIDL $GITHUB_REF_NAME"
